services:
  - type: web
    name: dispensary-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ROLE
        value: hospital
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SYNC_SHARED_SECRET
        generateValue: true
      - key: RUN_SYNC_WORKER
        value: "false"
      - key: STANDALONE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
